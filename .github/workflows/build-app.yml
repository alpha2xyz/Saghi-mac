name: Build app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish (release tag becomes v<version>)"
        required: true
        default: "0.3.1"
      publish:
        description: "Publish the release (false = build and test only, nothing is published)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      # transcribe.cpp (MIT), the commit the GGUF engine was measured with (docs/GGUF_RESULTS.md)
      TRANSCRIBE_CPP_SHA: adfc50210a3f026a655a3e19937d90ef2bf0728c
      # Q6_K GGUF of cohere-transcribe-arabic-07-2026 (Apache 2.0), pinned revision + sha256
      GGUF_REPO: handy-computer/cohere-transcribe-arabic-07-2026-gguf
      GGUF_REV: 715cbe09ca9b60fc1e497db1e4478fa9fcf4ac21
      GGUF_FILE: cohere-transcribe-arabic-07-2026-Q6_K.gguf
      GGUF_SHA256: f0fc615d27da3236166cd68cf9968c3be7d257b953bbba3b2e10e5d9f3fd1ff4
    steps:
      - name: Check version input
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "Bad version: $VERSION" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Disk space at start
        run: df -h /

      - name: Free runner disk (Android SDK, simulators; the bundle needs about 6 GB for the models alone)
        run: |
          set +e
          rm -rf "$HOME/Library/Android" "$HOME/Library/Caches" 2>/dev/null
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes /Library/Developer/CoreSimulator/Images /Library/Developer/CoreSimulator/Caches 2>/dev/null
          xcrun simctl delete all 2>/dev/null
          df -h /

      - name: Build transcribe-cli (arm64, static, Metal embedded)
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/transcribe.cpp"
          git init -q "$SRC"
          git -C "$SRC" fetch -q --depth 1 https://github.com/handy-computer/transcribe.cpp "$TRANSCRIBE_CPP_SHA"
          git -C "$SRC" checkout -q FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$TRANSCRIBE_CPP_SHA"
          # The default build is self-contained (ggml static, Metal library embedded).
          # Deployment target 13.0 keeps the binary runnable on macOS 13 and 14.
          cmake -S "$SRC" -B "$SRC/build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DTRANSCRIBE_BUILD_TESTS=OFF -DTRANSCRIBE_BUILD_EXAMPLES=ON
          cmake --build "$SRC/build" --target transcribe-cli -j 4
          CLI="$(find "$SRC/build" -name transcribe-cli -type f | head -n 1)"
          test -n "$CLI"
          mkdir -p "$RUNNER_TEMP/gguf-in"
          cp "$CLI" "$RUNNER_TEMP/gguf-in/transcribe-cli"
          cp "$SRC/LICENSE" "$RUNNER_TEMP/gguf-in/LICENSE-transcribe.cpp"
          CLI="$RUNNER_TEMP/gguf-in/transcribe-cli"
          codesign --force -s - "$CLI"
          file "$CLI"
          otool -L "$CLI"
          # Only system libraries may be linked (no Homebrew, no @rpath).
          if otool -L "$CLI" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)'; then
            echo "transcribe-cli links a non-system library (listed above)" >&2
            exit 1
          fi
          vtool -show-build "$CLI" | grep -E 'minos|platform'
          MINOS="$(vtool -show-build "$CLI" | awk '/minos/ {print $2; exit}')"
          test "${MINOS%%.*}" -le 13 || { echo "minos $MINOS is above 13.0" >&2; exit 1; }
          "$CLI" --help >/dev/null 2>&1 || "$CLI" -h >/dev/null 2>&1 || true

      - name: Download and verify the PyTorch model (release model-v1)
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/model-dl"
          MODEL="$RUNNER_TEMP/model-src"
          mkdir -p "$DL" "$MODEL"
          gh release download model-v1 --repo "$GITHUB_REPOSITORY" --dir "$DL" \
            --pattern 'model.safetensors.part-*' \
            --pattern 'model-config.zip' \
            --pattern 'SHA256SUMS'
          ls -la "$DL"
          cd "$DL"
          # SHA256SUMS lists the two parts, model-config.zip and the joined model.safetensors.
          # Join part by part and delete each part right after it is appended: the runner
          # disk is small, so the 3.8 GB must not exist twice.
          for p in model.safetensors.part-*; do
            grep "  $p\$" SHA256SUMS | shasum -a 256 -c -
            cat "$p" >> model.safetensors
            rm -f "$p"
          done
          grep '  model-config.zip$' SHA256SUMS | shasum -a 256 -c -
          grep '  model.safetensors$' SHA256SUMS | shasum -a 256 -c -
          mv model.safetensors "$MODEL/model.safetensors"
          unzip -q model-config.zip -d "$MODEL"
          rm -rf "$DL"
          test -f "$MODEL/config.json" || { echo "config.json missing after unzip (zip must have files at its root)" >&2; exit 1; }
          ls -la "$MODEL"
          df -h /

      - name: Download and verify the GGUF model
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/gguf-in"
          curl -fL --retry 5 --retry-delay 5 -o "$D/$GGUF_FILE" \
            "https://huggingface.co/$GGUF_REPO/resolve/$GGUF_REV/$GGUF_FILE"
          echo "$GGUF_SHA256  $D/$GGUF_FILE" | shasum -a 256 -c -
          # License texts of the GGUF repository (not present at the pinned revision's listing, so from main).
          curl -fL --retry 3 -o "$D/LICENSE" "https://huggingface.co/$GGUF_REPO/resolve/main/LICENSE"
          curl -fL --retry 3 -o "$D/NOTICE" "https://huggingface.co/$GGUF_REPO/resolve/main/NOTICE"
          head -n 3 "$D/LICENSE"
          ls -la "$D"
          df -h /

      - name: Build the bundle
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/gguf-in"
          SAGHI_MODEL_SRC_DIR="$RUNNER_TEMP/model-src" SAGHI_GGUF_SRC="$D/$GGUF_FILE" SAGHI_TRANSCRIBE_CLI="$D/transcribe-cli" SAGHI_GGUF_NOTICES_DIR="$D" \
            SAGHI_VERSION="$VERSION" python3 saghi-mac/packaging/build_bundle.py
          mv saghi-mac/packaging/output/Saghi-Mac-Portable ./Saghi-Mac-Portable
          rm -rf "$RUNNER_TEMP/model-src" "$RUNNER_TEMP/gguf-in" "$RUNNER_TEMP/transcribe.cpp" saghi-mac/packaging/.cache saghi-mac/packaging/output
          du -sh Saghi-Mac-Portable
          df -h /

      - name: Install (smoke test, hard failure)
        run: |
          set -euo pipefail
          export SAGHI_NO_LAUNCH=1
          echo n | bash Saghi-Mac-Portable/install-saghi.command
          APP="$HOME/Applications/Saghi.app"
          test -d "$APP" || { echo "Saghi.app was not created" >&2; exit 1; }
          RES="$APP/Contents/Resources"
          PYTHONPATH="$RES/app" QT_QPA_PLATFORM=offscreen "$RES/venv/bin/python3.12" -c \
            "import os, saghi, saghi.api, saghi.engine, saghi.updater, PySide6.QtCore; print('import ok:', saghi.__file__, saghi.__version__); assert saghi.__version__ == os.environ['VERSION'], 'version stamp missing'"
          # The fast engine must find its runner and model, and the full (PyTorch) model and torch must be installed too.
          PYTHONPATH="$RES/app" "$RES/venv/bin/python3.12" -c \
            "from saghi import gguf_engine as g; c=g.find_cli(); m=g.find_model(); print('cli:', c); print('model:', m); assert c and m, 'transcribe-cli or the .gguf was not found'"
          test -f "$RES/model/model.safetensors" || { echo "PyTorch model missing from the installed app" >&2; exit 1; }
          PYTHONPATH="$RES/app" SAGHI_MODEL_DIR="$RES/model" "$RES/venv/bin/python3.12" -c \
            "import torch; from saghi import engines; print('torch', torch.__version__); assert engines.pytorch_available(), 'Full model not detected'"
          du -sh "$APP"
          df -h /

      - name: Start local API and check health (hard failure)
        run: |
          set -euo pipefail
          RES="$HOME/Applications/Saghi.app/Contents/Resources"
          PYTHONPATH="$RES/app" SAGHI_MODEL_DIR="$RES/model" SAGHI_DATA_DIR="$RUNNER_TEMP/saghi-data" \
            nohup "$RES/venv/bin/python3.12" -m saghi.cli serve > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:17865/api/health > "$RUNNER_TEMP/health.json" 2>/dev/null; then
              echo "health ok:"; cat "$RUNNER_TEMP/health.json"; echo
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy. Server log:" >&2
          cat "$RUNNER_TEMP/api.log" >&2
          exit 1

      - name: Transcribe Arabic speech with the installed engine
        run: |
          set -euo pipefail
          RES="$HOME/Applications/Saghi.app/Contents/Resources"
          VOICE="$(say -v '?' | awk '/ ar_[A-Za-z0-9]+ / {print $1; exit}')"
          if [ -z "$VOICE" ]; then
            echo "::warning::No Arabic macOS voice on this runner: the transcription check was skipped."
            exit 0
          fi
          say -v "$VOICE" -o "$RUNNER_TEMP/ar.aiff" "مرحبا بكم في صاغي، هذا اختبار للكتابة الصوتية"
          afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/ar.aiff" "$RUNNER_TEMP/ar.wav"
          PYTHONPATH="$RES/app" SAGHI_DATA_DIR="$RUNNER_TEMP/saghi-data2" "$RES/venv/bin/python3.12" -c "
          import re, sys
          from saghi.gguf_engine import GgufEngine
          e = GgufEngine(); e.load()
          r = e.transcribe('$RUNNER_TEMP/ar.wav', language='ar', cleanup_level='light')
          print('device:', e.device, '| text:', r.text)
          assert re.search(r'[\u0600-\u06FF]{3,}', r.text), 'no Arabic text came back'
          "

      - name: Stop API and free space
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true; fi
          tail -n 40 "$RUNNER_TEMP/api.log" 2>/dev/null || true
          rm -rf "$HOME/Applications/Saghi.app" "$RUNNER_TEMP/saghi-data"
          df -h /

      - name: Package (zip, split, checksums)
        run: |
          set -euo pipefail
          ZIP="Saghi-mac-v${VERSION}.zip"
          APP_ZIP="Saghi-mac-app-v${VERSION}.zip"
          mkdir -p dist
          # Small code-only archive for the in-app updater (saghi/updater.py):
          # saghi/ (with its _version.py stamp) + the pinned requirements file.
          (cd Saghi-Mac-Portable && zip -qr -X "../dist/${APP_ZIP}" saghi requirements-arm64.txt -x '*.DS_Store' '*__pycache__*')
          unzip -l "dist/${APP_ZIP}" | tail -3
          unzip -p "dist/${APP_ZIP}" saghi/_version.py
          df -h /
          # Stream the zip straight into split so the whole zip never sits on disk
          # (the runner disk is small). The bundle is about 6.3 GB, so this makes 4 parts
          # of at most 1900 MiB (aa, ab, ac, ad); the installer joins any number of parts.
          ditto -c -k --keepParent Saghi-Mac-Portable - | split -b 1900m - "dist/${ZIP}.part-"
          rm -rf Saghi-Mac-Portable
          df -h /
          ls -la dist
          cd dist
          # the checksum of the whole zip = checksum of the parts joined in order
          ZIP_SHA="$(cat "${ZIP}".part-* | shasum -a 256 | awk '{print $1}')"
          cp ../saghi-mac/packaging/Install-Saghi-mac.command .
          chmod +x Install-Saghi-mac.command
          # The in-app updater refuses any file without a line here.
          { shasum -a 256 "${ZIP}".part-*; echo "${ZIP_SHA}  ${ZIP}"; shasum -a 256 "${APP_ZIP}" Install-Saghi-mac.command; } > SHA256SUMS
          # A zip keeps the run permission that browsers strip from a bare .command download.
          ditto -c -k --sequesterRsrc Install-Saghi-mac.command Install-Saghi-mac.zip
          ls -la
          cat SHA256SUMS
          df -h /

      - name: Publish release
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          cd dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            # remove old part files so a re-run with fewer parts leaves no stale assets
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '^Saghi-mac-.*\.zip\.part-' || true); do
              gh release delete-asset "$TAG" "$a" -y
            done
            gh release upload "$TAG" Saghi-mac-v*.zip.part-* Saghi-mac-app-v*.zip SHA256SUMS Install-Saghi-mac.command Install-Saghi-mac.zip --clobber
          else
            gh release create "$TAG" Saghi-mac-v*.zip.part-* Saghi-mac-app-v*.zip SHA256SUMS Install-Saghi-mac.command Install-Saghi-mac.zip \
              --title "Saghi-mac ${TAG}" --latest \
              --notes "Free Arabic voice typing for Apple-silicon Macs. Download Install-Saghi-mac.zip, unzip it, and double-click Install-Saghi-mac.command. See the README for the first-run steps."
          fi
          gh release view "$TAG"
