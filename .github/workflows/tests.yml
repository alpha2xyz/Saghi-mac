name: tests

# Runs the Linux-safe dev tests on every PR and push to main. The model is
# not downloaded: tests that need it skip on their own.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth xclip libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Install Python packages
        run: |
          python -m pip install -q --disable-pip-version-check \
            numpy PySide6 soundfile sounddevice soxr pynput fastapi uvicorn httpx python-multipart keyring keyrings.alt
      - name: Run tests
        working-directory: saghi-mac
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          # test_paste_unit needs a Mac clipboard; test_e2e_dictation needs a real mic and speakers.
          failed=""
          for t in dev/test_*.py; do
            case "$t" in *test_paste_unit.py|*test_e2e_dictation.py) continue ;; esac
            echo "::group::$t"
            if SAGHI_DATA_DIR=$(mktemp -d) xvfb-run -a python "$t"; then echo "PASS $t"; else echo "FAIL $t"; failed="$failed $t"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi
